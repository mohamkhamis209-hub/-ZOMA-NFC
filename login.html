<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول — ZOMA</title><link rel="stylesheet" href="css/zoma.css"></head><body><main class="form-wrap"><form class="form panel" id="f"><div class="eyebrow">WELCOME BACK</div><h1>تسجيل الدخول</h1><p class="muted">تقدر تستخدم البريد أو رقم الهاتف أو Card ID.</p><div class="field"><label>البريد / الهاتف / Card ID</label><input id="identifier" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="btn btn-primary" style="width:100%">دخول</button><p id="m" class="muted"></p></form></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{await loginWithIdentifier(identifier.value,password.value);location.href="dashboard.html"}catch(x){m.textContent="بيانات الدخول غير صحيحة"}};</script></body></html>
