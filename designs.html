<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التصميمات — ZOMA</title><link rel="stylesheet" href="css/zoma.css"></head><body><main class="section"><div class="container"><div class="dash-head"><div><div class="eyebrow">DESIGN COLLECTION</div><h1>التصميمات</h1></div><a class="btn" href="dashboard.html">لوحتي</a></div><div id="grid" class="grid3"></div></div></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>(async()=>{const {data,error}=await db.from("designs").select("*,design_templates(name,config)").eq("is_active",true).order("created_at");grid.innerHTML=error?`<div class="panel">${esc(error.message)}</div>`:(data||[]).map(d=>{const c=d.config||d.design_templates?.config||{};return `<article class="feature"><div class="eyebrow">${esc(d.code)}</div><h2>${esc(d.name)}</h2><div style="height:150px;border-radius:18px;margin:15px 0;background:${esc(c.background||"#151a22")};display:grid;place-items:center"><b style="color:${esc(c.primary||"#d8b15a")}">ZOMA</b></div><strong>${money(d.price)}</strong><a class="btn btn-primary" style="width:100%;margin-top:14px" href="order.html?design=${d.id}">اختيار</a></article>`}).join("")})();</script></body></html>
