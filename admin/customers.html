<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العملاء — ZOMA</title><link rel="stylesheet" href="../css/zoma.css"></head><body><main class="admin-main"><h1>العملاء</h1><section class="panel"><div class="search"><input id="q" placeholder="اسم أو هاتف"><button class="btn" onclick="render()">بحث</button></div><div class="table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>الهاتف</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>let all=[];function render(){const s=q.value.toLowerCase().trim();const x=s?all.filter(p=>`${p.full_name} ${p.phone}`.toLowerCase().includes(s)):all;rows.innerHTML=x.map(p=>`<tr><td>${esc(p.full_name||"-")}</td><td>${esc(p.phone||"-")}</td><td>${esc(p.status)}</td><td>${new Date(p.created_at).toLocaleDateString("ar-EG")}</td></tr>`).join("")} (async()=>{await requireAdmin();const {data,error}=await db.from("profiles").select("*").order("created_at",{ascending:false});if(error)return alert(error.message);all=data||[];render()})()</script></body></html>
