<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأدمن — ZOMA</title><link rel="stylesheet" href="../css/zoma.css"></head><body><main class="admin-main"><h1>إدارة المشرفين</h1><section class="panel"><p class="muted">المالك يرى ويدير كل المشرفين. إضافة مستخدم جديد تتم أولًا من Authentication ثم تضيف User ID هنا.</p><div class="row"><div class="field"><label>User ID</label><input id="uid"></div><div class="field"><label>الاسم</label><input id="dn"></div></div><div class="field"><label>الدور</label><select id="role"><option>support</option><option>manager</option><option>owner</option></select></div><button class="btn btn-primary" onclick="addA()">إضافة</button></section><section class="panel" style="margin-top:18px"><div class="table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>الدور</th><th>نشط</th><th>User ID</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="toast" class="toast"></div><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>async function load(){const {data,error}=await db.from("admins").select("*").order("created_at");if(error)return toast(error.message,"err");rows.innerHTML=(data||[]).map(a=>`<tr><td>${esc(a.display_name||"-")}</td><td>${esc(a.role)}</td><td>${a.is_active?"نعم":"لا"}</td><td>${esc(a.user_id)}</td></tr>`).join("")}async function addA(){const {error}=await db.from("admins").insert({user_id:uid.value.trim(),display_name:dn.value.trim(),role:role.value,is_active:true});if(error)return toast(error.message,"err");toast("تمت الإضافة");load()}(async()=>{const a=await requireAdmin();if(a.role!=="owner"){document.body.innerHTML='<main class="admin-main"><h1>غير مصرح</h1></main>';return}load()})()</script></body></html>
