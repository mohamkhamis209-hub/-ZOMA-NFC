<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطلبات — ZOMA</title><link rel="stylesheet" href="../css/zoma.css"></head><body><main class="admin-main"><div class="dash-head"><div><a class="brand" href="index.html">ZO<span>MA</span></a><h1>الطلبات</h1></div></div><section class="panel"><div class="search"><input id="q" placeholder="ابحث برقم الطلب أو الاسم أو الهاتف"><button class="btn" onclick="load()">بحث</button></div><div class="table-wrap"><table class="table"><thead><tr><th>الطلب</th><th>العميل</th><th>التصميم</th><th>السعر</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="toast" class="toast"></div><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>let all=[];async function load(){let x=all;const s=q.value.trim().toLowerCase();if(s)x=all.filter(o=>[o.order_number,o.customer_name,o.phone].join(" ").toLowerCase().includes(s));rows.innerHTML=x.map(o=>`<tr><td>${esc(o.order_number)}</td><td>${esc(o.customer_name||"-")}<br>${esc(o.phone||"")}</td><td>${esc(o.designs?.name||"-")}</td><td>${money(o.price)}</td><td><select onchange="status('${o.id}',this.value)">${["pending","confirmed","preparing","ready","shipped","delivered","rejected","cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td><td>${o.card_id?'<span class="badge ok">Card issued</span>':`<button class="btn btn-primary" onclick="confirmO('${o.id}')">تأكيد + إنشاء كارت</button>`}</td></tr>`).join("")||'<tr><td colspan="6">لا توجد نتائج</td></tr>'}async function status(id,s){const {error}=await db.from("orders").update({status:s}).eq("id",id);if(error)toast(error.message,"err");else toast("تم تحديث الحالة")}async function confirmO(id){const {error}=await db.rpc("confirm_order",{target_order_id:id});if(error)toast(error.message,"err");else{toast("تم إنشاء الكارت");load()}}(async()=>{await requireAdmin();const {data,error}=await db.from("orders").select("*,designs(name)").order("created_at",{ascending:false});if(error)return toast(error.message,"err");all=data||[];load()})();</script></body></html>
