<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بيانات ZOMA</title><link rel="stylesheet" href="../css/zoma.css"></head><body><main class="admin-main"><h1>إدارة البيانات</h1><section class="panel"><h2>تنظيف البيانات التشغيلية</h2><p class="muted">هذه العمليات مخصصة للمالك. لا يتم حذف العملاء أو التصميمات من الواجهة التشغيلية.</p><button class="btn btn-danger" onclick="resetAnalytics()">حذف Analytics</button><button class="btn btn-danger" onclick="resetMessages()">حذف الرسائل</button><button class="btn btn-danger" onclick="resetActivity()">حذف سجل النشاط</button></section></main><div id="toast" class="toast"></div><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>(async()=>{const a=await requireAdmin();if(a.role!=="owner")document.body.innerHTML='<main class="admin-main"><h1>غير مصرح</h1></main>'})();async function wipe(table){if(!confirm("تأكيد الحذف؟"))return;const {error}=await db.from(table).delete().not("id","is",null);toast(error?.message||"تم الحذف",error?"err":"ok")}function resetAnalytics(){wipe("analytics")}function resetMessages(){wipe("messages")}function resetActivity(){wipe("activity_logs")}</script></body></html>
