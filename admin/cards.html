<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الكروت — ZOMA</title><link rel="stylesheet" href="../css/zoma.css"></head><body><main class="admin-main"><h1>الكروت</h1><section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Card ID</th><th>العميل</th><th>الحالة</th><th>الرابط</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="toast" class="toast"></div><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/nfc.js"></script><script>(async()=>{await requireAdmin();const {data,error}=await db.from("cards").select("*,profiles(full_name)").order("created_at",{ascending:false});if(error)return toast(error.message,"err");rows.innerHTML=(data||[]).map(c=>{const url=`${location.origin}${location.pathname.replace("admin/cards.html","")}card.html?id=${c.public_slug}`;return `<tr><td>${esc(c.card_uid)}</td><td>${esc(c.profiles?.full_name||"-")}</td><td>${esc(c.status)}</td><td><a class="btn" target="_blank" href="../card.html?id=${c.public_slug}">فتح</a></td><td><div class="actions" style="margin:0">${c.status==="active"?`<button class="btn btn-danger" onclick="suspendC('${c.id}')">تعليق</button>`:c.status==="suspended"?`<button class="btn" onclick="reactivateC('${c.id}')">تفعيل</button>`:""} ${c.status!=="replaced"?`<button class="btn" onclick="replaceC('${c.id}')">استبدال</button>`:""}<button class="btn" onclick='writeCardNfc("${url}")'>NFC</button></div></td></tr>`}).join("")})();async function suspendC(id){const {error}=await db.rpc("suspend_card",{target_card_id:id});if(error)toast(error.message,"err");else location.reload()}async function reactivateC(id){const {error}=await db.rpc("reactivate_card",{target_card_id:id});if(error)toast(error.message,"err");else location.reload()}async function replaceC(id){if(!confirm("استبدال الكارت؟"))return;const {data,error}=await db.rpc("replace_card",{old_card_id:id});if(error)toast(error.message,"err");else{toast("تم الاستبدال");location.reload()}}async function writeCardNfc(url){try{await writeNfc(url);toast("تمت كتابة NFC")}catch(e){toast(e.message,"err")}}</script></body></html>
