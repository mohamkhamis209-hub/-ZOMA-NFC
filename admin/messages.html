<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الرسائل — ZOMA</title><link rel="stylesheet" href="../css/zoma.css"></head><body><main class="admin-main"><h1>الرسائل</h1><section class="panel"><div id="list"></div></section></main><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>(async()=>{await requireAdmin();const {data,error}=await db.from("messages").select("*").order("created_at",{ascending:false});if(error)return alert(error.message);list.innerHTML=(data||[]).map(m=>`<article class="feature" style="margin:10px 0"><b>${esc(m.subject)}</b><span class="badge">${esc(m.status)}</span><p>${esc(m.message)}</p><small class="muted">${new Date(m.created_at).toLocaleString("ar-EG")}</small><div><button class="btn" onclick="closeM('${m.id}')">إغلاق</button></div></article>`).join("")})();async function closeM(id){await db.from("messages").update({status:"closed"}).eq("id",id);location.reload()}</script></body></html>
