<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحليلات ZOMA</title><link rel="stylesheet" href="../css/zoma.css"></head><body><main class="admin-main"><h1>التحليلات</h1><div class="stats"><div class="stat"><strong id="views">0</strong><span>إجمالي المشاهدات</span></div><div class="stat"><strong id="today">0</strong><span>اليوم</span></div></div><section class="panel" style="margin-top:18px"><h2>آخر الأحداث</h2><div id="list"></div></section></main><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>(async()=>{await requireAdmin();const {data}=await db.from("analytics").select("*,profiles(full_name),cards(card_uid)").order("created_at",{ascending:false}).limit(100);views.textContent=data?.length||0;const d=new Date();d.setHours(0,0,0,0);today.textContent=(data||[]).filter(x=>new Date(x.created_at)>=d).length;list.innerHTML=(data||[]).map(x=>`<div class="feature" style="margin:7px 0"><b>${esc(x.event_type)}</b> — ${esc(x.profiles?.full_name||"-")} — ${esc(x.cards?.card_uid||"-")}<br><small class="muted">${new Date(x.created_at).toLocaleString("ar-EG")}</small></div>`).join("")})()</script></body></html>
