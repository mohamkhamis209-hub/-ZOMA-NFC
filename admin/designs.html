<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التصميمات — ZOMA</title><link rel="stylesheet" href="../css/zoma.css"></head><body><main class="admin-main"><div class="dash-head"><h1>التصميمات</h1><button class="btn btn-primary" onclick="openForm()">+ تصميم جديد</button></div><section class="split"><div class="panel"><h2>التصميمات الحالية</h2><div id="list"></div></div><div class="panel hidden" id="editor"><h2>تحرير التصميم</h2><form id="f"><input type="hidden" id="id"><div class="field"><label>Code</label><input id="code" required></div><div class="field"><label>الاسم</label><input id="name" required></div><div class="field"><label>الوصف</label><textarea id="description"></textarea></div><div class="row"><div class="field"><label>السعر</label><input id="price" type="number" min="0" required></div><div class="field"><label>النوع</label><select id="type"><option>template</option><option>image</option><option>code</option><option>custom</option></select></div></div><div class="field"><label>لون الخلفية</label><input id="background" value="#11151d"></div><div class="field"><label>اللون الأساسي</label><input id="primary" value="#d8b15a"></div><button class="btn btn-primary">حفظ</button></form></div></section></main><div id="toast" class="toast"></div><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>let all=[];function openForm(x){editor.classList.remove("hidden");if(x){id.value=x.id;code.value=x.code;name.value=x.name;description.value=x.description||"";price.value=x.price;type.value=x.design_type;background.value=x.config?.background||"#11151d";primary.value=x.config?.primary||"#d8b15a"}else{f.reset();id.value=""}}async function load(){const {data,error}=await db.from("designs").select("*").order("created_at");if(error)return toast(error.message,"err");all=data||[];list.innerHTML=all.map(x=>`<div class="feature" style="margin:8px 0"><b>${esc(x.name)}</b> <span class="badge">${money(x.price)}</span><div class="muted">${esc(x.code)}</div><button class="btn" onclick='openForm(${JSON.stringify(x)})'>تعديل</button><button class="btn" onclick="toggle('${x.id}',${x.is_active})">${x.is_active?"تعطيل":"تفعيل"}</button></div>`).join("")}async function toggle(i,a){const {error}=await db.from("designs").update({is_active:!a}).eq("id",i);if(error)toast(error.message,"err");else load()}f.onsubmit=async e=>{e.preventDefault();const payload={code:code.value.trim(),name:name.value.trim(),description:description.value.trim(),price:Number(price.value),design_type:type.value,config:{background:background.value,primary:primary.value}};const {error}=id.value?await db.from("designs").update(payload).eq("id",id.value):await db.from("designs").insert(payload);if(error)return toast(error.message,"err");toast("تم الحفظ");load()};(async()=>{await requireAdmin();load()})()</script></body></html>
