<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOMA Card</title><link rel="stylesheet" href="css/zoma.css"><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script></head><body><main class="public-card"><section class="public-shell" id="shell"><div class="public-cover"><img id="avatar" class="public-avatar"></div><div class="public-body"><div class="eyebrow">ZOMA SMART IDENTITY</div><h1 id="name">...</h1><div id="role" class="gold"></div><p id="bio" class="muted"></p><div id="contact" class="socials"></div><div id="socials" class="socials"></div><div class="actions"><button id="save" class="btn btn-primary">حفظ جهة اتصال</button><button id="share" class="btn">مشاركة</button></div><div style="text-align:center;margin-top:22px"><div id="qr" style="display:inline-block;background:white;padding:9px;border-radius:12px"></div><div id="uid" class="muted"></div></div></div></section></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get("id");if(!id)return;const {data:c,error}=await db.from("cards").select("*,profiles(*)").eq("public_slug",id).eq("status","active").single();if(error||!c){shell.innerHTML='<div class="public-body"><h1>الكارت غير متاح</h1><p class="muted">قد يكون موقوفًا أو غير موجود.</p></div>';return}const p=c.profiles;name.textContent=p.full_name||"ZOMA";role.textContent=p.job_title||"";bio.textContent=p.bio||"";uid.textContent=c.card_uid;if(p.avatar_url){avatar.src=p.avatar_url;avatar.alt=p.full_name||"ZOMA"}else{avatar.style.display="none"}const contactItems=[];if(p.phone)contactItems.push(`<a class="social" href="tel:${esc(p.phone)}">اتصال: ${esc(p.phone)}</a>`);if(p.whatsapp){const w=String(p.whatsapp).replace(/\D/g,"");contactItems.push(`<a class="social" href="https://wa.me/${w}" target="_blank" rel="noopener">واتساب</a>`)}if(p.whatsapp_2 && p.whatsapp_2_visible){const w2=String(p.whatsapp_2).replace(/\D/g,"");contactItems.push(`<a class="social" href="https://wa.me/${w2}" target="_blank" rel="noopener">واتساب 2</a>`)}if(p.email)contactItems.push(`<a class="social" href="mailto:${esc(p.email)}">البريد</a>`);contact.innerHTML=contactItems.join("");const {data:s}=await db.from("social_links").select("*").eq("profile_id",p.id).eq("is_active",true).order("sort_order");socials.innerHTML=(s||[]).map(x=>`<a class="social" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.platform)}</a>`).join("");new QRCode(qr,{text:location.href,width:130,height:130});await db.from("analytics").insert({profile_id:p.id,card_id:c.id,event_type:"profile_view",device:navigator.userAgent.slice(0,120),browser:navigator.appName,referrer:document.referrer||null,path:location.pathname});save.onclick=()=>{const v=`BEGIN:VCARD\\nVERSION:3.0\\nFN:${p.full_name||""}\\nTEL:${p.phone||""}\\nEMAIL:${p.email||""}\\nURL:${location.href}\\nEND:VCARD`;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([v],{type:"text/vcard"}));a.download="zoma-contact.vcf";a.click()};share.onclick=async()=>{if(navigator.share)await navigator.share({title:p.full_name||"ZOMA",url:location.href});else{await navigator.clipboard.writeText(location.href);alert("تم نسخ الرابط")}}})();</script></body></html>
