<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحتي — ZOMA</title><link rel="stylesheet" href="css/zoma.css"></head><body><header class="topbar"><div class="container"><a class="brand" href="index.html">ZO<span>MA</span></a><div class="actions" style="margin:0"><a class="btn" href="designs.html">التصميمات</a><button class="btn" data-logout>خروج</button></div></div></header><main class="dashboard"><div class="container"><div class="dash-head"><div><div class="eyebrow">CUSTOMER DASHBOARD</div><h1 id="hello">مرحبًا</h1></div><a class="btn btn-primary" href="order.html">+ طلب كارت</a></div><div class="stats"><div class="stat"><strong id="cc">0</strong><span>الكروت</span></div><div class="stat"><strong id="oc">0</strong><span>الطلبات</span></div><div class="stat"><strong id="vc">0</strong><span>المشاهدات</span></div><div class="stat"><strong id="nc">0</strong><span>الإشعارات</span></div></div><div class="split" style="margin-top:18px"><section class="panel"><h2>بياناتي</h2><form id="pf"><div class="row"><div class="field"><label>الاسم الأول</label><input id="first_name"></div><div class="field"><label>الاسم الثاني</label><input id="middle_name"></div></div><div class="row"><div class="field"><label>الاسم الثالث</label><input id="third_name"></div><div class="field"><label>اسم العائلة</label><input id="last_name"></div></div><div class="field"><label>الاسم الكامل</label><input id="full_name"></div><div class="field"><label>المسمى الوظيفي</label><input id="job_title"></div><div class="row"><div class="field"><label>الهاتف</label><input id="phone"></div><div class="field"><label>واتساب</label><input id="whatsapp"></div></div><div class="row"><div class="field"><label>واتساب 2</label><input id="whatsapp_2"></div><div class="field"><label>إظهار واتساب 2</label><select id="whatsapp_2_visible"><option value="false">لا</option><option value="true">نعم</option></select></div></div><div class="field"><label>نبذة</label><textarea id="bio" rows="4"></textarea></div><button class="btn btn-primary">حفظ</button></form></section><section class="panel"><h2>كروتي</h2><div id="cards"></div><h2 style="margin-top:25px">طلباتي</h2><div class="table-wrap"><table class="table"><tbody id="orders"></tbody></table></div></section></div></div></main><div id="toast" class="toast"></div><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/ui.js"></script><script>(async()=>{const u=await requireAuth();const {data:p}=await db.from("profiles").select("*").eq("id",u.id).single();if(p){hello.textContent=`مرحبًا، ${p.full_name||""}`;["full_name","job_title","phone","whatsapp","whatsapp_2","bio"].forEach(k=>document.getElementById(k).value=p[k]||"");whatsapp_2_visible.value=String(!!p.whatsapp_2_visible)}const [c,o,a,n]=await Promise.all([db.from("cards").select("*").eq("user_id",u.id).order("created_at",{ascending:false}),db.from("orders").select("*,designs(name)").eq("customer_id",u.id).order("created_at",{ascending:false}),db.from("analytics").select("id",{count:"exact",head:true}).eq("profile_id",u.id),db.from("notifications").select("id",{count:"exact",head:true}).eq("user_id",u.id).eq("is_read",false)]);cc.textContent=c.data?.length||0;oc.textContent=o.data?.length||0;vc.textContent=a.count||0;nc.textContent=n.count||0;cards.innerHTML=(c.data||[]).map(x=>`<div class="feature" style="margin:9px 0"><b>${esc(x.card_uid)}</b><div class="muted">${esc(x.status)}</div><a class="btn" href="card.html?id=${esc(x.public_slug)}">فتح الكارت</a></div>`).join("")||'<p class="muted">لم يتم إصدار كارت.</p>';orders.innerHTML=(o.data||[]).map(x=>`<tr><td>${esc(x.order_number)}</td><td>${esc(x.designs?.name||"-")}</td><td>${money(x.price)}</td><td><span class="badge warn">${esc(x.status)}</span></td></tr>`).join("")||'<tr><td>لا توجد طلبات</td></tr>'})();pf.onsubmit=async e=>{e.preventDefault();const u=await currentUser();const {error}=await db.from("profiles").update({first_name:first_name.value.trim(),middle_name:middle_name.value.trim(),third_name:third_name.value.trim(),last_name:last_name.value.trim(),full_name:full_name.value.trim(),job_title:job_title.value.trim(),phone:phone.value.trim(),whatsapp:whatsapp.value.trim(),whatsapp_2:whatsapp_2.value.trim(),whatsapp_2_visible:whatsapp_2_visible.value==="true",bio:bio.value.trim()}).eq("id",u.id);toast(error?.message||"تم حفظ البيانات",error?"err":"ok")}</script></body></html>
