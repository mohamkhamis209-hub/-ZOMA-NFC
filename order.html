<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب كارت — ZOMA</title><link rel="stylesheet" href="css/zoma.css"></head><body><main class="form-wrap"><form class="form panel" id="f"><div class="eyebrow">NEW ORDER</div><h1>طلب كارت ZOMA</h1><div class="field"><label>التصميم</label><select id="design" required></select></div><div class="field"><label>رقم الهاتف</label><input id="phone" required></div><div class="row"><div class="field"><label>المحافظة</label><input id="governorate" required></div><div class="field"><label>المدينة</label><input id="city" required></div></div><div class="field"><label>العنوان بالتفصيل</label><textarea id="address" rows="3" required></textarea></div><div class="field"><label>ملاحظات</label><textarea id="notes" rows="3"></textarea></div><div class="notice">السعر: <b id="price">—</b></div><button class="btn btn-primary" style="width:100%;margin-top:14px">إرسال الطلب</button><p id="m" class="muted"></p></form></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>(async()=>{await requireAuth();const {data}=await db.from("designs").select("id,name,price").eq("is_active",true);design.innerHTML=(data||[]).map(d=>`<option value="${d.id}" data-price="${d.price}">${esc(d.name)} — ${money(d.price)}</option>`).join("");const q=new URLSearchParams(location.search).get("design");if(q)design.value=q;function refresh(){price.textContent=money(design.options[design.selectedIndex]?.dataset.price||0)}design.onchange=refresh;refresh()})();f.onsubmit=async e=>{e.preventDefault();const u=await currentUser(),s=design.options[design.selectedIndex];const {data:p}=await db.from("profiles").select("full_name").eq("id",u.id).single();const {error}=await db.from("orders").insert({customer_id:u.id,design_id:design.value,customer_name:p?.full_name||u.email,phone:phone.value.trim(),governorate:governorate.value.trim(),city:city.value.trim(),detailed_address:address.value.trim(),customer_notes:notes.value.trim(),price:Number(s?.dataset.price||0),order_number:""});m.textContent=error?.message||"تم إرسال الطلب";if(!error)setTimeout(()=>location.href="dashboard.html",700)}</script></body></html>
